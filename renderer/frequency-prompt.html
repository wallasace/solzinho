<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Frequência personalizada</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #4a3818;
    }
    body {
      padding: 14px;
      display: flex;
    }
    #card {
      flex: 1;
      background: linear-gradient(160deg, #fffdf6, #fff2d2);
      border: 1.5px solid rgba(240, 190, 90, 0.7);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(120, 90, 20, 0.28);
      padding: 14px 16px;
    }
    form {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }
    label {
      font-size: 12px;
      line-height: 1.3;
    }
    input {
      font-size: 15px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1.5px solid rgba(240, 190, 90, 0.7);
      outline: none;
      width: 100%;
      background: #fffef9;
      color: #4a3818;
    }
    .buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    button {
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }
    #confirm {
      background: #f5c451;
      color: #4a3818;
      font-weight: 600;
    }
    #cancel {
      background: transparent;
      color: #4a3818;
    }
  </style>
</head>
<body>
  <div id="card">
    <form id="form">
      <label for="minutes" id="freq-label"></label>
      <input type="number" id="minutes" min="1" max="1440" step="1" required />
      <div class="buttons">
        <button type="button" id="cancel"></button>
        <button type="submit" id="confirm"></button>
      </div>
    </form>
  </div>

  <script src="i18n.js"></script>
  <script src="frequency-prompt.js"></script>
</body>
</html>
