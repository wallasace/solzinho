<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>menu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    body {
      padding: 12px;
    }
    #menu {
      background: linear-gradient(160deg, #fffdf6, #fff2d2);
      border: 1.5px solid rgba(240, 190, 90, 0.7);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(120, 90, 20, 0.28);
      padding: 6px;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 500;
      color: #4a3818;
      cursor: pointer;
      line-height: 1.3;
    }
    .item:hover {
      background: rgba(245, 196, 81, 0.35);
    }
    .item.danger {
      color: #a3402c;
    }
    .item.danger:hover {
      background: rgba(220, 90, 70, 0.16);
    }
    .item.sub-item {
      padding-left: 22px;
      font-weight: 400;
    }
    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9a7a3a;
      padding: 6px 10px 2px;
    }
    .divider {
      height: 1px;
      margin: 4px 4px;
      background: rgba(240, 190, 90, 0.4);
    }
    .radio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      border: 1.5px solid rgba(154, 122, 58, 0.6);
      flex-shrink: 0;
    }
    .item.checked .radio-dot {
      background: #f0a93a;
      border-color: #f0a93a;
    }
    /* indicador de liga/desliga nas opções de estado persistente (dicas,
       caminhada, sons, iniciar com o Windows) — mostra o estado atual de
       cara, sem depender só de ler o verbo do texto */
    .toggle-dot {
      width: 15px;
      height: 15px;
      border-radius: 5px;
      border: 1.5px solid rgba(154, 122, 58, 0.5);
      flex-shrink: 0;
      position: relative;
    }
    .toggle-dot.on {
      background: #f0a93a;
      border-color: #f0a93a;
    }
    .toggle-dot.on::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 0px;
      width: 4px;
      height: 8px;
      border: solid #fffdf6;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .lang-row {
      display: flex;
      gap: 8px;
      padding: 4px 10px 6px;
    }
    .lang-btn {
      font-size: 18px;
      line-height: 1;
      padding: 4px 10px;
      border-radius: 9px;
      cursor: pointer;
      border: 1.5px solid transparent;
    }
    .lang-btn:hover {
      background: rgba(245, 196, 81, 0.25);
    }
    .lang-btn.active {
      border-color: #f0a93a;
      background: rgba(245, 196, 81, 0.3);
    }
  </style>
</head>
<body>
  <div id="menu"></div>
  <script src="i18n.js"></script>
  <script src="context-menu.js"></script>
</body>
</html>
