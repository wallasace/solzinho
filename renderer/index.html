<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>solzinho</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="sun-wrap">
    <svg id="glow" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6d5" stop-opacity="0.95" />
          <stop offset="55%" stop-color="#ffd76a" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#ffd76a" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle id="glow-circle" cx="100" cy="100" r="90" fill="url(#glowGradient)" />
      <g id="rays" fill="#ffdf8f">
        <rect x="94" y="4" width="12" height="36" rx="6" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(45 100 100)" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(90 100 100)" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(135 100 100)" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(180 100 100)" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(225 100 100)" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(270 100 100)" />
        <rect x="94" y="4" width="12" height="36" rx="6" transform="rotate(315 100 100)" />
      </g>
    </svg>
    <div id="sun"><span id="face">🌞</span><div id="mouth"></div><svg id="sunglasses" viewBox="-6 0 76 22" xmlns="http://www.w3.org/2000/svg">
        <!-- hastes -->
        <path d="M0 5 L-6 1" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />
        <path d="M64 5 L70 1" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round" />
        <!-- ponte -->
        <rect x="24" y="6" width="16" height="4" rx="2" fill="#1a1a1a" />
        <!-- lentes, formato wayfarer (trapézio, mais largo em cima) -->
        <path d="M1 3 L27 3 L23 18 Q22.5 19 21.5 19 L6.5 19 Q5.5 19 5 18 Z" fill="#1a1a1a" />
        <path d="M37 3 L63 3 L59 18 Q58.5 19 57.5 19 L42.5 19 Q41.5 19 41 18 Z" fill="#1a1a1a" />
        <!-- brilho -->
        <path d="M8 7 Q13 5 18 7" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M44 7 Q49 5 54 7" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-linecap="round" />
      </svg></div>
    <div id="moon-wrap"><div id="moon">🌚</div></div>
  </div>

  <script src="i18n.js"></script>
  <script src="messages.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
